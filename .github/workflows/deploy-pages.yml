name: Deploy To GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    environment: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Resolve Vite env
        shell: bash
        run: |
          if [ -n "${{ vars.VITE_APP_PASSWORD }}" ]; then
            echo "VITE_APP_PASSWORD=${{ vars.VITE_APP_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "VITE_APP_PASSWORD=${{ secrets.VITE_APP_PASSWORD }}" >> "$GITHUB_ENV"
          fi

      - name: Validate Vite env
        shell: bash
        run: |
          if [ -z "${VITE_APP_PASSWORD}" ]; then
            echo "Missing VITE_APP_PASSWORD in GitHub Environment or Secrets."
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
